<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recover Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css?v=2.0"/>
  <script src="js/theme.js"></script>
  <style>
    .step-section {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }
    .step-active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">

    <button class="back-btn" onclick="location.href='loginpage1.html'">&#8592; Back to Login</button>

    <!-- Step 1: Request OTP -->
    <div id="step1" class="step-section step-active">
      <h1 class="page-title"><span>Recover</span> Password</h1>
      <p class="subtitle">Enter your registered email to receive a reset code.</p>

      <div class="floating-group" id="fg-fp-email">
        <input type="email" id="fpEmail"/>
        <label for="fpEmail">Email Address</label>
        <div class="inline-error" id="fpEmailErr"></div>
      </div>

      <button class="btn-login" onclick="sendOTP()" id="btnSendOtp">Send Recovery Code</button>
    </div>

    <!-- Step 2: Verify OTP -->
    <div id="step2" class="step-section">
      <h1 class="page-title"><span>Verification</span></h1>
      <div id="fpTargetEmail" style="font-size: 15px; font-weight: 600; color: #38bdf8; text-align: center; margin-bottom: 20px; letter-spacing: 0.5px;"></div>
      <p class="subtitle">Enter the 6-digit code sent to your email.</p>

      <div class="floating-group">
        <input type="text" id="fpOtp" maxlength="6"/>
        <label for="fpOtp">Verification Code</label>
        <div class="inline-error" id="fpOtpErr"></div>
      </div>

      <div style="text-align: center; margin-top: -10px; margin-bottom: 20px;">
        <span style="font-size: 13px; color: var(--muted);">Didn't get code? </span>
        <a href="#" id="resendFpLink" onclick="resendFpOtp(); return false;" style="color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 500;">Resend Code</a>
      </div>
      
      <p style="font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 20px;">
        Wrong email? <a href="#" onclick="goBackToStep1(); return false;" style="color: var(--accent);">Change email</a>
      </p>

      <button class="btn-login" onclick="verifyOTP()" id="btnVerifyOtp">Verify Identity</button>
    </div>

    <!-- Step 3: New Password -->
    <div id="step3" class="step-section">
      <h1 class="page-title"><span>New</span> Password</h1>
      <p class="subtitle">Set a new secure password for your account.</p>

      <div class="floating-group" id="fg-fp-pass">
        <input type="password" id="fpNewPass" oninput="validateFPPassMatch()"/>
        <label for="fpNewPass">New Password</label>
        <div class="inline-error" id="fpNewPassErr"></div>
      </div>
      
      <div class="floating-group" id="fg-fp-cpass">
        <input type="password" id="fpConfirmPass" oninput="validateFPPassMatch()"/>
        <label for="fpConfirmPass">Confirm Password</label>
        <div class="inline-error" id="fpConfirmPassErr"></div>
      </div>

      <button class="btn-login" onclick="resetPassword()" id="btnResetPass">Update Password</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="js/script.js?v=3.3"></script>
  
  <!-- Theme Toggle Button -->
  <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Switch to Light Mode">☀️</button>
  
  <script>
    let savedEmail = '';
    let savedOtp = '';

    function clearErrors() {
      const inputs = document.querySelectorAll('input');
      const errors = document.querySelectorAll('.inline-error');
      inputs.forEach(i => i.classList.remove('invalid-input'));
      errors.forEach(e => { 
        e.style.display = 'none'; 
        e.textContent = ''; 
        e.style.color = '#f87171'; 
      });
    }

    function validateFPPassMatch() {
      const pass = document.getElementById('fpNewPass');
      const cpass = document.getElementById('fpConfirmPass');
      const cpassErr = document.getElementById('fpConfirmPassErr');
      
      const passVal = pass.value;
      const cpassVal = cpass.value;

      if (!cpassVal || cpassVal.length < passVal.length) {
        cpass.classList.remove('invalid-input');
        cpassErr.style.display = 'none';
        return;
      }

      if (passVal === cpassVal) {
        cpass.classList.remove('invalid-input');
        cpassErr.textContent = 'Passwords match';
        cpassErr.style.color = '#4ade80';
        cpassErr.style.display = 'block';
      } else {
        cpass.classList.add('invalid-input');
        cpassErr.textContent = 'Passwords mismatch';
        cpassErr.style.color = '#f87171';
        cpassErr.style.display = 'block';
      }
    }

    async function sendOTP() {
      clearErrors();
      const emailInput = document.getElementById('fpEmail');
      const errDiv = document.getElementById('fpEmailErr');
      
      if (!emailInput.value.trim()) {
        emailInput.classList.add('invalid-input');
        errDiv.textContent = 'Email address is required!';
        errDiv.style.display = 'block';
        return;
      }
      
      const btn = document.getElementById('btnSendOtp');
      setBtnLoading(btn, true);

      try {
        const res = await fetch(`http://${window.location.hostname}:8000/api/send-otp/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim() })
        });
        const data = await res.json();
        setBtnLoading(btn, false);
        if (data.status === 'success') {
          savedEmail = emailInput.value.trim();
          const targetEl = document.getElementById('fpTargetEmail');
          if (targetEl) targetEl.innerHTML = savedEmail;
          document.getElementById('step1').classList.remove('step-active');
          document.getElementById('step2').classList.add('step-active');
        } else {
          emailInput.classList.add('invalid-input');
          errDiv.textContent = data.message || 'Account not found!';
          errDiv.style.display = 'block';
        }
      } catch (err) {
        setBtnLoading(btn, false);
        showToast('Server error! Please try again.');
      }
    }

    function goBackToStep1() {
      clearErrors();
      document.getElementById('step2').classList.remove('step-active');
      document.getElementById('step1').classList.add('step-active');
    }

    async function resendFpOtp() {
      const link = document.getElementById('resendFpLink');
      if (link.style.pointerEvents === 'none') return;
      link.style.pointerEvents = 'none';
      link.style.opacity = '0.5';
      let seconds = 30;
      const timer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          link.innerHTML = 'Resend Code';
          link.style.pointerEvents = 'auto';
          link.style.opacity = '1';
        } else {
          link.innerHTML = `Resend in (${seconds}s)`;
        }
      }, 1000);
      try {
        const res = await fetch(`http://${window.location.hostname}:8000/api/send-otp/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: savedEmail })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast('A new code has been sent!');
        } else {
          showToast(data.message || 'Failed to resend!');
        }
      } catch (err) {}
    }

    async function verifyOTP() {
      clearErrors();
      const otpInput = document.getElementById('fpOtp');
      const errDiv = document.getElementById('fpOtpErr');
      if (otpInput.value.trim().length < 6) {
        otpInput.classList.add('invalid-input');
        errDiv.textContent = 'Enter a valid 6-digit code!';
        errDiv.style.display = 'block';
        return;
      }
      const btn = document.getElementById('btnVerifyOtp');
      setBtnLoading(btn, true);
      try {
        const res = await fetch(`http://${window.location.hostname}:8000/api/verify-otp/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: savedEmail, otp: otpInput.value.trim() })
        });
        const data = await res.json();
        setBtnLoading(btn, false);
        if (data.status === 'success') {
          savedOtp = otpInput.value.trim();
          document.getElementById('step2').classList.remove('step-active');
          document.getElementById('step3').classList.add('step-active');
        } else {
          otpInput.classList.add('invalid-input');
          errDiv.textContent = data.message || 'Verification failed!';
          errDiv.style.display = 'block';
        }
      } catch (err) {
        setBtnLoading(btn, false);
        showToast('Verification error!');
      }
    }

    async function resetPassword() {
      clearErrors();
      const pass = document.getElementById('fpNewPass');
      const cpass = document.getElementById('fpConfirmPass');
      const passErr = document.getElementById('fpNewPassErr');
      const cpassErr = document.getElementById('fpConfirmPassErr');
      let valid = true;
      if (!pass.value || pass.value.length < 8) {
        pass.classList.add('invalid-input');
        passErr.textContent = 'Min. 8 characters required!';
        passErr.style.display = 'block';
        valid = false;
      }
      if (pass.value !== cpass.value) {
        cpass.classList.add('invalid-input');
        cpassErr.textContent = 'Passwords mismatch!';
        cpassErr.style.display = 'block';
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('btnResetPass');
      setBtnLoading(btn, true);
      try {
        const res = await fetch(`http://${window.location.hostname}:8000/api/reset-password/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: savedEmail, otp: savedOtp, new_password: pass.value })
        });
        const data = await res.json();
        setBtnLoading(btn, false);
        if (data.status === 'success') {
          showToast('Password updated! Redirecting...');
          setTimeout(() => { window.location.href = 'loginpage1.html'; }, 2000);
        } else {
          pass.classList.add('invalid-input');
          passErr.textContent = data.message || 'Error occurred!';
          passErr.style.display = 'block';
        }
      } catch (err) {
        setBtnLoading(btn, false);
        showToast('Network error!');
      }
    }
    // Enter Key Listeners
    document.addEventListener('DOMContentLoaded', () => {
      // Step 1: Email
      const fpEmail = document.getElementById('fpEmail');
      if (fpEmail) {
        fpEmail.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { sendOTP(); }
        });
      }
      // Step 2: OTP
      const fpOtp = document.getElementById('fpOtp');
      if (fpOtp) {
        fpOtp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { verifyOTP(); }
        });
      }
      // Step 3: Password & Confirm
      const fpNewPass = document.getElementById('fpNewPass');
      const fpConfirmPass = document.getElementById('fpConfirmPass');
      if (fpNewPass) {
        fpNewPass.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { resetPassword(); }
        });
      }
      if (fpConfirmPass) {
        fpConfirmPass.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { resetPassword(); }
        });
      }
    });
  </script>
</body>
</html>
